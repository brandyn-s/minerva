name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: minerva
          POSTGRES_PASSWORD: synthetic-only
          POSTGRES_DB: minerva_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U minerva -d minerva_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Set up exact npm
        run: |
          npm install --global npm@12.0.2
          test "$(npm --version)" = "12.0.2"

      - name: Install dependencies
        run: npm ci

      - name: Check source
        run: npm run check

      - name: Install UI test browser
        run: npx playwright install --with-deps chromium

      - name: Verify UI contracts and accessibility
        run: npm run test:ui

      - name: Verify atlas and durable Expedition journeys
        run: npm run test:browser

      - name: Verify Expedition worker restart
        run: npm run test:expedition-process

      - name: Verify PostgreSQL controls and stagnation
        run: node scripts/verify-expedition-postgres.mjs
        env:
          EXPEDITION_DATABASE_URL: postgres://minerva:synthetic-only@127.0.0.1:5432/minerva_test

      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-regression-evidence
          path: evaluation-artifacts/browser
          retention-days: 7
